<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#13141A" rx="8"/>

  <!-- Top-left box: hatched -->
  <rect x="6" y="6" width="24" height="24" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <clipPath id="tl">
    <rect x="6" y="6" width="24" height="24" rx="3"/>
  </clipPath>
  <g clip-path="url(#tl)">
    <line x1="0" y1="12" x2="12" y2="0" stroke="#888" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="20" y2="0" stroke="#888" stroke-width="1.5"/>
    <line x1="0" y1="28" x2="28" y2="0" stroke="#888" stroke-width="1.5"/>
    <line x1="4" y1="32" x2="32" y2="4" stroke="#888" stroke-width="1.5"/>
    <line x1="12" y1="32" x2="32" y2="12" stroke="#888" stroke-width="1.5"/>
    <line x1="20" y1="32" x2="32" y2="20" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- Top-right box: empty dashed -->
  <rect x="34" y="6" width="24" height="24" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>

  <!-- Bottom-left box: empty dashed -->
  <rect x="6" y="34" width="24" height="24" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>

  <!-- Bottom-right box: solid gold -->
  <rect x="34" y="34" width="24" height="24" fill="#E8A838" rx="3"/>
</svg>
